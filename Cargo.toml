[package]
name = "degen-portal"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "degen-tools for social: Discord and X as HTTP tools an agent can call, with the accounts, allowlists and audit trail that posting in public needs"
license = "MIT"
publish = false
readme = "README.md"

[lib]
name = "degen_portal"
path = "src/lib.rs"

[[bin]]
name = "degen-portal"
path = "src/main.rs"

[dependencies]
# The shared engine, its own repo. Hacking on both at once? Point cargo at a
# local checkout:
#   [patch."https://github.com/ethereumdegen/degen-core"]
#   degen-core = { path = "../degen-core" }
degen-core = { git = "https://github.com/ethereumdegen/degen-core" }
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
