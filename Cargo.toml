[package]
name = "degen-portal"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "degen-tools for social: Discord and X as HTTP tools an agent can call, with the accounts, allowlists and audit trail that posting in public needs"
license = "MIT"
publish = false
readme = "README.md"

[lib]
name = "degen_portal"
path = "src/lib.rs"

[[bin]]
name = "degen-portal"
path = "src/main.rs"

[dependencies]
# The shared engine. Hacking on both at once? Point cargo at a local checkout:
#   [patch.crates-io]
#   degen-tools-core = { path = "../degen-tools-core" }
degen-tools-core = "0.1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }

[dev-dependencies]
parking_lot = "0.12"
futures-util = "0.3"
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
